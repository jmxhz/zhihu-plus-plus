name: Nightly Builds

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to publish
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/my-build-action.yml
    if: startsWith(github.ref, 'refs/heads/') && inputs.release_tag == ''
    with:
      name: 'Nightly Builds'
    secrets: inherit
  build_minified_release:
    uses: ./.github/workflows/my-build-action.yml
    if: startsWith(github.ref, 'refs/heads/') && inputs.release_tag == ''
    with:
      name: 'Minified Builds'
      minify: true
      nightly_release: true
    secrets: inherit
  release:
    uses: ./.github/workflows/my-build-action.yml
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    with:
      name: 'Release'
      release: true
      minify: true
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
