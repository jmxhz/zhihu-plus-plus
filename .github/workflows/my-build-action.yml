on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      args:
        required: false
        type: string
      minify:
        required: false
        type: boolean
      release:
        required: false
        type: boolean
      nightly_release:
        required: false
        type: boolean
      release_tag:
        required: false
        type: string
    secrets:
      ANDROID_SIGNING_KEY:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android Lite (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      # Set Current Date As Env Variable
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'
      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          override: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android

      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Cache Rust
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./rs-hf-tokenizer/target/
          key: rust-cache-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-cache-
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
            ./.gradle
            ./**/.gradle
          # dont invalidate cache if only gradle.properties is changed -- they
          key: gradle-cache-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
      # Run Tests Build
      - name: Run KtLint
        run: ./gradlew ktlintCheck
      #- name: Run gradle tests
      #  run: ./gradlew test
      - name: Build App
        # Build .apk
        run: bash ./gradlew ${{ inputs.args }} assembleLiteRelease
        env:
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI_BUILD_MINIFY: ${{ inputs.minify }}
      - name: Move files
        run: |
          mkdir -p app/build/upload
          shopt -s nullglob
          apks=(app/build/outputs/apk/lite/release/app-lite-arm64-v8a-release*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one Lite ARM64-v8a APK, found ${#apks[@]}" >&2
            exit 1
          fi
          mv "${apks[0]}" app/build/upload/zhihu++-lite-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.repository_name }} - ${{ inputs.name }}
          path: app/build/upload/zhihu++-lite-arm64-v8a.apk

      # Delete existing nightly release
      - name: Delete existing nightly release
        if: ${{ inputs.minify && inputs.nightly_release }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = 'nightly';

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            for (const release of releases.filter(r => r.tag_name === tagName)) {
              core.info(`Deleting nightly release ${release.id} (${release.name || release.tag_name})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tagName}`,
              });
              core.info(`Deleted tag ${tagName}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Tag ${tagName} does not exist`);
              } else {
                throw error;
              }
            }

      # Generate nightly changelog
      - name: Generate nightly changelog
        if: ${{ inputs.minify && inputs.nightly_release }}
        id: nightly_changelog
        uses: actions/github-script@v7
        with:
          script: |
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Find the latest non-nightly tag
            const lastReleaseTag = tags.find(t => t.name !== 'nightly');
            let since;
            if (lastReleaseTag) {
              const { data: tagCommit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: lastReleaseTag.commit.sha,
              });
              since = tagCommit.commit.committer.date;
            } else {
              // Fallback: 24 hours ago
              since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            }

            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: since,
              per_page: 50,
            });

            if (commits.length === 0) {
              return 'No changes since last release.';
            }

            const lines = [];
            for (const c of commits) {
              const msg = c.commit.message.split('\n')[0];
              const sha = c.sha.substring(0, 7);
              lines.push(`- ${msg} (${sha})`);
            }

            if (lastReleaseTag) {
              return `**Changes since ${lastReleaseTag.name}:**\n\n` + lines.join('\n');
            } else {
              return `**Recent changes:**\n\n` + lines.join('\n');
            }
          result-encoding: string

      # Create new nightly release
      - name: Create Nightly Release
        if: ${{ inputs.minify && inputs.nightly_release }}
        id: nightly_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build (${{ env.date_today }})
          body: |
            Nightly build generated on ${{ env.date_today }}

            ${{ steps.nightly_changelog.outputs.result }}
          files: app/build/upload/zhihu++-lite-arm64-v8a.apk
          fail_on_unmatched_files: true
          prerelease: true
      - name: Generate release notes
        if: ${{ inputs.release && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') }}
        id: release_notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
            });
            console.log(data.body);
            return data.body;
          result-encoding: string

      - name: Create Release
        if: ${{ inputs.release && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') }}
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          body: |
            仅提供 Android Lite ARM64-v8a 安装包。

            ${{ steps.release_notes.outputs.result }}
          files: app/build/upload/zhihu++-lite-arm64-v8a.apk
          fail_on_unmatched_files: true
          prerelease: false
